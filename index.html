<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #example-scanning-overlay { display: none; }

      /* Posição do Pop Up */
      .custom-popup {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 9999;
      }

      /* Caixa do pop up */
      .custom-popup.is-open { display: flex; }
      .custom-popup-card {
        width: min(92vw, 420px);
        background: #FFCDA6;
        border-radius: 12px;
        padding: 20px 22px;
        box-sizing: border-box;
        font-family: sans-serif;
        text-align: center;
      }

      /* Texto do Pop Up */
      .custom-popup-text {
        margin: 0 0 16px;
        color: #111111;
        font-size: 16px;
        white-space: nowrap;
      }

      /* Botão do Pop Up */
      .custom-popup-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .popup-btn {
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
      }

      .popup-btn.cancel { background: #784115; color: #ffffff; }
      .popup-btn.confirm { background: #784115; color: #ffffff; }
    </style>

    <script>
      // 1. Expandido para os 12 targets no total (4 grupos x 3 cartões)
      let globalTargetStates = {
        0: { visible: false, lastFoundAt: 0 }, 1: { visible: false, lastFoundAt: 0 }, 2: { visible: false, lastFoundAt: 0 },
        3: { visible: false, lastFoundAt: 0 }, 4: { visible: false, lastFoundAt: 0 }, 5: { visible: false, lastFoundAt: 0 },
        6: { visible: false, lastFoundAt: 0 }, 7: { visible: false, lastFoundAt: 0 }, 8: { visible: false, lastFoundAt: 0 },
        9: { visible: false, lastFoundAt: 0 }, 10: { visible: false, lastFoundAt: 0 }, 11: { visible: false, lastFoundAt: 0 }
      };
      
      let globalPopupOpen = false;
      let lastSelectedImage = null; // DECLARAÇÃO GLOBAL CORRIGIDA
      let activeTargetIndex = null;

      // 2. Mapeamento da Imagem Base (Fase 1) para todos os grupos
      const imagensFase1 = {
        // Grupo 1
        0: './assets/hotdog.png',
        1: './assets/sardine.png',
        2: './assets/cozido.png',
        // Grupo 2
        3: './assets/presunto.png',
        4: './assets/lanche.png',
        5: './assets/rissois.png',
        // Grupo 3 
        6: './assets/queijo.png',
        7: './assets/azeitonas.png',
        8: './assets/broa.png',
        // Grupo 4 
        9: './assets/hamburger.png',
        10: './assets/presunto.png',
        11: './assets/caldoverde.png'
      };

      // 3. Mapeamento da Imagem Trocada (Fase 2) para todos os grupos
      const imagensFase2 = {
        // Grupo 1
        0: './assets/lombo.png',
        1: './assets/panado.png',
        2: './assets/arrozdepolvo.png',
        // Grupo 2
        3: './assets/hamburger.png',
        4: './assets/vaca.png',
        5: './assets/croquete.png',
        // Grupo 3
        6: './assets/torrada.png',
        7: './assets/chourico.png',
        8: './assets/batatafrita.png',
        // Grupo 4
        9: './assets/sandespanado.png',
        10: './assets/hotdog.png',
        11: './assets/sopa.png'
      };

      // Estado inicial de fases de cada um dos alvos
      let fasesDosTargets = { 
        0: 1, 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 
        6: 1, 7: 1, 8: 1, 9: 1, 10: 1, 11: 1 
      };

      const getCurrentImageData = (targetIndex) => {
        const faseAtual = (fasesDosTargets && fasesDosTargets[targetIndex]) ? fasesDosTargets[targetIndex] : 1;
        const src = faseAtual === 1 ? imagensFase1[targetIndex] : imagensFase2[targetIndex];
        return {
          type: 'IMAGE_STATE_CHANGED',
          visible: true,
          targetIndex: targetIndex,
          nomeImagem: src || '',
          fase: faseAtual
        };
      };

      const notifyReactNative = (payload) => {
        try {
          if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
            window.ReactNativeWebView.postMessage(JSON.stringify(payload));
          }
        } catch (e) {
          console.warn('postMessage failed', e);
        }
      };

      // Função global de abertura do Pop-up para ser usada de qualquer bloco
      function openCustomPopup() {
        const popup = document.getElementById('custom-popup');
        if (popup) popup.classList.add('is-open');
        globalPopupOpen = true;
      }

      function closeCustomPopup() {
        const popup = document.getElementById('custom-popup');
        if (popup) popup.classList.remove('is-open');
        globalPopupOpen = false;
      }

      window.trocarModeloAR = function() {
        const targetAtivo = (activeTargetIndex !== null) ? activeTargetIndex : (() => {
          for (const index in globalTargetStates) {
            if (globalTargetStates[index].visible) {
              return parseInt(index);
            }
          }
          return null;
        })();

        if (targetAtivo === null || targetAtivo === undefined) {
          console.log("WebAR: Nenhum alvo ativo. Botão ignorado.");
          return;
        }

        const imgTarget = document.getElementById(`asset-target-${targetAtivo}`);
        if (!imgTarget) {
          console.log(`WebAR: Imagem do alvo ${targetAtivo} não encontrada.`);
          return;
        }

        const novaFase = (fasesDosTargets[targetAtivo] === 1) ? 2 : 1;
        const novoSrc = novaFase === 1 ? imagensFase1[targetAtivo] : imagensFase2[targetAtivo];

        fasesDosTargets[targetAtivo] = novaFase;
        imgTarget.setAttribute('src', novoSrc);

        // Força o A-Frame a reaplicar a textura depois do src mudar.
        if (imgTarget.object3DMap && imgTarget.object3DMap.mesh) {
          imgTarget.object3DMap.mesh.traverse((node) => {
            if (node && node.material) {
              node.material.needsUpdate = true;
            }
          });
        }

        console.log(`WebAR: Alvo ${targetAtivo} alterado para a Fase ${novaFase}.`);

        notifyReactNative(getCurrentImageData(targetAtivo));
      };

      AFRAME.registerComponent('clickable-image', {
        init: function () {
          const el = this.el;
          const targetEl = el.closest('[mindar-image-target]');

          if (targetEl) {
            const targetIndexAttr = targetEl.getAttribute('mindar-image-target');
            const targetIndex = targetIndexAttr ? parseInt(targetIndexAttr.split(':')[1] || targetIndexAttr.split('=')[1]) : 0;

            targetEl.addEventListener('targetFound', function () {
              globalTargetStates[targetIndex].visible = true;
              globalTargetStates[targetIndex].lastFoundAt = Date.now();
              activeTargetIndex = targetIndex;
              notifyReactNative(getCurrentImageData(targetIndex));
            });

            targetEl.addEventListener('targetLost', function () {
              globalTargetStates[targetIndex].visible = false;
              if (activeTargetIndex === targetIndex) {
                activeTargetIndex = null;
              }
              notifyReactNative({
                type: 'IMAGE_STATE_CHANGED',
                visible: false,
                targetIndex: targetIndex,
                nomeImagem: '',
                fase: (fasesDosTargets && fasesDosTargets[targetIndex]) ? fasesDosTargets[targetIndex] : 1
              });
            });

            // Clique direto na imagem tridimensional
            el.addEventListener('click', function () {
              if (globalTargetStates[targetIndex].visible) {
                activeTargetIndex = targetIndex;
                console.log(`WebAR: Refeição ${targetIndex} foi clicada.`);

                const dadosResposta = {
                  type: 'IMAGE_CLICKED',
                  targetIndex: targetIndex,
                  fase: fasesDosTargets[targetIndex],
                  nomeImagem: fasesDosTargets[targetIndex] === 1 ? imagensFase1[targetIndex] : imagensFase2[targetIndex]
                };

                lastSelectedImage = dadosResposta;

                // Envia para a app e abre o pop-up local
                notifyReactNative(dadosResposta);
                openCustomPopup();
              }
            });
          }
        }
      });

      // Gestão de listeners do Pop-up unificada
      document.addEventListener('DOMContentLoaded', function() {
        const cancelBtn = document.getElementById('popup-cancel');
        const continueBtn = document.getElementById('popup-continue');

        if (cancelBtn) {
          cancelBtn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            closeCustomPopup();
            notifyReactNative({ type: 'POPUP_CANCEL', action: 'close' });
          });
        }

        if (continueBtn) {
          continueBtn.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopPropagation();
            closeCustomPopup();
            
            // Se o utilizador clicou sem selecionar fisicamente, apanha o que estiver focado na câmara
            if (!lastSelectedImage) {
              for (const idx in globalTargetStates) {
                if (globalTargetStates[idx].visible) {
                  lastSelectedImage = getCurrentImageData(parseInt(idx));
                  break;
                }
              }
            }

            notifyReactNative({
              type: 'POPUP_CONFIRM',
              action: 'continue',
              imagemSelecionada: lastSelectedImage
            });
            console.log('Pagina Seguinte enviada.');
          });
        }

        // Toque alternativo no fundo do ecrã caso o utilizador falhe o prato
        document.addEventListener('touchend', function (event) {
          if (globalPopupOpen) return;
          const anyTargetVisible = Object.values(globalTargetStates).some(function(state) {
            return state.visible && (Date.now() - state.lastFoundAt) >= 250;
          });

          if (anyTargetVisible) {
            event.preventDefault();
            openCustomPopup();
          }
        });
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      
      <!-- Câmara com o Cursor de cliques corrigido -->
      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-cursor raycaster="objects: [clickable-image]" visible="false"></a-cursor>
      </a-camera>

      <!-- ─── GRUPO 1 ─── -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image id="asset-target-0" src="./assets/hotdog.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-image id="asset-target-1" src="./assets/sardine.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-image id="asset-target-2" src="./assets/cozido.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>

      <!-- ─── GRUPO 2 ─── -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-image id="asset-target-3" src="./assets/presunto.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 4">
        <a-image id="asset-target-4" src="./assets/lanche.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 5">
        <a-image id="asset-target-5" src="./assets/rissois.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>

      <!-- ─── GRUPO 3 ─── -->
      <a-entity mindar-image-target="targetIndex: 6">
        <a-image id="asset-target-6" src="./assets/queijo.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 7">
        <a-image id="asset-target-7" src="./assets/azeitonas.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 8">
        <a-image id="asset-target-8" src="./assets/broa.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>

      <!-- ─── GRUPO 4 ─── -->
      <a-entity mindar-image-target="targetIndex: 9">
        <a-image id="asset-target-9" src="./assets/hamburger.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 10">
        <a-image id="asset-target-10" src="./assets/presunto.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 11">
        <a-image id="asset-target-11" src="./assets/caldoverde.png" position="0 0 0" scale="1 0.5" clickable-image></a-image>
      </a-entity>
    </a-scene>

    <!-- Estrutura do Pop Up Branco de Confirmação -->
    <div id="custom-popup" class="custom-popup">
      <div class="custom-popup-card">
        <p class="custom-popup-text">Tem a certeza de que quer continuar?</p>
        <div class="custom-popup-actions">
          <button id="popup-cancel" class="popup-btn cancel" type="button">Não</button>
          <button id="popup-continue" class="popup-btn confirm" type="button">Sim</button>
        </div>
      </div>
    </div>
  </body>
</html>
