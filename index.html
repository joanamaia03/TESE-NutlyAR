<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #example-scanning-overlay { display: none; }

      .custom-popup {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 9999;
      }

      .custom-popup.is-open { display: flex; }
      .custom-popup-card {
        width: min(92vw, 420px);
        background: #FFCDA6;
        border-radius: 12px;
        padding: 20px 22px;
        box-sizing: border-box;
        font-family: sans-serif;
        text-align: center;
      }

      .custom-popup-text {
        margin: 0 0 16px;
        color: #6B3E1F;
        font-size: 16px;
        white-space: nowrap;
      }

      .custom-popup-actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .popup-btn {
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
      }
      .popup-btn.cancel { background: #784115; color: #ffffff; }
      .popup-btn.confirm { background: #784115; color: #ffffff; }
    </style>

    <script>
      let globalTargetStates = {
        0: { visible: false, lastFoundAt: 0 },
        1: { visible: false, lastFoundAt: 0 },
        2: { visible: false, lastFoundAt: 0 }
      };
      let globalPopupOpen = false;
      let globalLastClicked = null;

      const imagensFase1 = {
        0: './assets/hotdog.png',
        1: './assets/sardine.png',
        2: './assets/cozido.png'
      };

      const imagensFase2 = {
        0: './assets/pizza.jpg',
        1: './assets/pataniscas.jpg',
        2: './assets/omelete.jpg'
      };

      let fasesDosTargets = { 0: 1, 1: 1, 2: 1 };

      const getCurrentImageData = (targetIndex) => {
        const faseAtual = (fasesDosTargets && fasesDosTargets[targetIndex]) ? fasesDosTargets[targetIndex] : 1;
        const src = faseAtual === 1 ? imagensFase1[targetIndex] : imagensFase2[targetIndex];
        return {
          type: 'IMAGE_STATE_CHANGED',
          visible: true,
          targetIndex: targetIndex,
          nomeImagem: src || '',
          fase: faseAtual
        };
      };

      const notifyReactNative = (payload) => {
        try {
          if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
            window.ReactNativeWebView.postMessage(JSON.stringify(payload));
          }
        } catch (e) {
          console.warn('postMessage failed', e);
        }
      };

      window.trocarModeloAR = function() {
        let targetAtivo = null;
        for (const index in globalTargetStates) {
          if (globalTargetStates[index].visible) {
            targetAtivo = parseInt(index);
            break;
          }
        }

        if (targetAtivo === null) {
          console.log('WebAR: Nenhum alvo detetado. Botão ignorado.');
          return;
        }

        const imgTarget = document.getElementById(`asset-target-${targetAtivo}`);
        if (!imgTarget) return;

        if (fasesDosTargets[targetAtivo] === 1) {
          imgTarget.setAttribute('src', imagensFase2[targetAtivo]);
          fasesDosTargets[targetAtivo] = 2;
          console.log(`WebAR: Alvo ${targetAtivo} alterado para a Fase 2.`);
        } else {
          imgTarget.setAttribute('src', imagensFase1[targetAtivo]);
          fasesDosTargets[targetAtivo] = 1;
          console.log(`WebAR: Alvo ${targetAtivo} restaurado para a Fase 1.`);
        }

        notifyReactNative(getCurrentImageData(targetAtivo));
      };

      const openCustomPopup = () => {
        const popup = document.getElementById('custom-popup');
        if (popup) popup.classList.add('is-open');
      };

      const closeCustomPopup = () => {
        const popup = document.getElementById('custom-popup');
        if (popup) popup.classList.remove('is-open');
      };

      const openPopupForVisibleTarget = () => {
        if (!globalLastClicked) {
          for (const idx in globalTargetStates) {
            if (globalTargetStates[idx].visible) {
              try { globalLastClicked = getCurrentImageData(parseInt(idx)); } catch (e) {}
              break;
            }
          }
        }
        globalPopupOpen = true;
        openCustomPopup();
        window.setTimeout(() => { globalPopupOpen = false; }, 250);
      };

      document.addEventListener('DOMContentLoaded', () => {
        const cancelBtn = document.getElementById('popup-cancel');
        const continueBtn = document.getElementById('popup-continue');

        if (cancelBtn) {
          cancelBtn.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            closeCustomPopup();
            notifyReactNative({ type: 'POPUP_CANCEL', action: 'close' });
          });
        }

        if (continueBtn) {
          continueBtn.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            closeCustomPopup();
            let payloadImage = globalLastClicked;
            if (!payloadImage) {
              for (const idx in globalTargetStates) {
                if (globalTargetStates[idx].visible) {
                  payloadImage = getCurrentImageData(parseInt(idx));
                  break;
                }
              }
            }
            notifyReactNative({
              type: 'POPUP_CONFIRM',
              action: 'continue',
              imagemSelecionada: payloadImage || null
            });
            console.log('Pagina Seguinte');
          });
        }

        document.addEventListener('click', function() {
          if (globalPopupOpen) return;
          const anyTargetVisible = Object.values(globalTargetStates).some(function(state) {
            return state.visible && (Date.now() - state.lastFoundAt) >= 250;
          });
          if (anyTargetVisible) {
            openPopupForVisibleTarget();
          }
        });

        document.addEventListener('touchend', function(event) {
          if (globalPopupOpen) return;
          const anyTargetVisible = Object.values(globalTargetStates).some(function(state) {
            return state.visible && (Date.now() - state.lastFoundAt) >= 250;
          });
          if (anyTargetVisible) {
            event.preventDefault();
            openPopupForVisibleTarget();
          }
        });
      });

      AFRAME.registerComponent('clickable-image', {
        init: function () {
          const el = this.el;
          const targetEl = el.closest('[mindar-image-target]');

          if (targetEl) {
            const targetIndexAttr = targetEl.getAttribute('mindar-image-target');
            const targetIndex = targetIndexAttr ? parseInt(targetIndexAttr.split(':')[1] || targetIndexAttr.split('=')[1]) : 0;

            targetEl.addEventListener('targetFound', function () {
              globalTargetStates[targetIndex].visible = true;
              globalTargetStates[targetIndex].lastFoundAt = Date.now();
              try { globalLastClicked = getCurrentImageData(targetIndex); } catch(e){}
              notifyReactNative(getCurrentImageData(targetIndex));
            });

            targetEl.addEventListener('targetLost', function () {
              globalTargetStates[targetIndex].visible = false;
              notifyReactNative({
                type: 'IMAGE_STATE_CHANGED',
                visible: false,
                targetIndex: targetIndex,
                nomeImagem: '',
                fase: (fasesDosTargets && fasesDosTargets[targetIndex]) ? fasesDosTargets[targetIndex] : 1
              });
              try { if (globalLastClicked && globalLastClicked.targetIndex === targetIndex) globalLastClicked = null; } catch(e){}
            });

            try {
              this.el.addEventListener('click', function (ev) {
                try {
                  const src = (ev && ev.target && ev.target.getAttribute) ? ev.target.getAttribute('src') : null;
                  const clickedPayload = {
                    type: 'IMAGE_CLICKED',
                    targetIndex: targetIndex,
                    nomeImagem: src || '',
                    fase: (fasesDosTargets && fasesDosTargets[targetIndex]) ? fasesDosTargets[targetIndex] : 1
                  };
                  globalLastClicked = { targetIndex: clickedPayload.targetIndex, nomeImagem: clickedPayload.nomeImagem, fase: clickedPayload.fase };
                  notifyReactNative(clickedPayload);
                  openPopupForVisibleTarget();
                  notifyReactNative(getCurrentImageData(targetIndex));
                } catch (e) {
                  console.warn('IMAGE_CLICKED post failed', e);
                }
              });
            } catch (e) {
              /* ignore if addEventListener not allowed */
            }
          }
        }
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image
          id="asset-target-0"
          src="./assets/hotdog.png"
          position="0 0 0"
          scale="1 0.5"
          clickable-image>
        </a-image>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-image
          id="asset-target-1"
          src="./assets/sardine.png"
          position="0 0 0"
          scale="1 0.5"
          clickable-image>
        </a-image>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-image
          id="asset-target-2"
          src="./assets/cozido.png"
          position="0 0 0"
          scale="1 0.5"
          clickable-image>
        </a-image>
      </a-entity>
    </a-scene>

    <div id="custom-popup" class="custom-popup">
      <div class="custom-popup-card">
        <p class="custom-popup-text">Tem a certeza de que quer continuar?</p>
        <div class="custom-popup-actions">
          <button id="popup-cancel" class="popup-btn cancel" type="button">Não</button>
          <button id="popup-continue" class="popup-btn confirm" type="button">Sim</button>
        </div>
      </div>
    </div>
  </body>
</html>
